<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中山南西店排班系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 版面：頂部工具列 + 店長分頁（大表格水平捲動）／員工單欄手機畫面 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D6DCD9; --line-soft:#E4E8E6;
  --fg:#1B2421; --muted:#5E6B66; --faint:#8A9590;
  --accent:#14605A; --accent-fg:#FFFFFF; --accent-soft:#DCEDEA;
  --open:#B86E0B; --open-bg:#FBEBD2;
  --mid:#2F7A4B; --mid-bg:#DDF0E3;
  --close:#4450A0; --close-bg:#E2E5F7;
  --peak:#7A4D9E; --peak-bg:#F0E6F8;
  --off-bg:#EEF0EF;
  --good:#22834F; --good-bg:#DDF2E5; --warn:#B26A00; --warn-bg:#FCEFD9; --bad:#C2372C; --bad-bg:#FBE3E0;
  --shadow:0 6px 24px rgba(20,40,35,.14);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1A2220; --sunk:#222B29; --line:#33403C; --line-soft:#283230;
  --fg:#E6ECE9; --muted:#9DABA5; --faint:#71807A;
  --accent:#4DB6A9; --accent-fg:#0B1513; --accent-soft:#1D3633;
  --open:#F0B35A; --open-bg:#3A2B14; --mid:#6FCB92; --mid-bg:#1C3424; --close:#9AA6F2; --close-bg:#262B4A;
  --peak:#C9A2EA; --peak-bg:#33263F; --off-bg:#232B29;
  --good:#5FD093; --good-bg:#183324; --warn:#F2B654; --warn-bg:#3A2C12; --bad:#FF877B; --bad-bg:#40201C;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2220; --sunk:#222B29; --line:#33403C; --line-soft:#283230;
  --fg:#E6ECE9; --muted:#9DABA5; --faint:#71807A;
  --accent:#4DB6A9; --accent-fg:#0B1513; --accent-soft:#1D3633;
  --open:#F0B35A; --open-bg:#3A2B14; --mid:#6FCB92; --mid-bg:#1C3424; --close:#9AA6F2; --close-bg:#262B4A;
  --peak:#C9A2EA; --peak-bg:#33263F; --off-bg:#232B29;
  --good:#5FD093; --good-bg:#183324; --warn:#F2B654; --warn-bg:#3A2C12; --bad:#FF877B; --bad-bg:#40201C;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}

/* 頂部 */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav b{min-width:104px;text-align:center;font-size:15px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:disabled{opacity:.35;cursor:default}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs a{padding:9px 12px 10px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.banner{background:var(--warn-bg);color:var(--warn);font-size:13px;padding-block:8px}

main{padding-block:18px 48px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:18px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}

/* 工具列與指標 */
.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;margin-top:2px;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--font)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--good)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 班表格 */
.gridbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 230px);min-height:320px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
.grid th,.grid td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);padding:0;text-align:center;height:34px}
.grid thead th{position:sticky;top:0;background:var(--surface);z-index:3;height:46px;font-weight:500;color:var(--muted)}
.grid .namecol{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:0 10px;min-width:150px;max-width:150px;border-right:1px solid var(--line)}
.grid thead .namecol{z-index:4}
.grid .dh{min-width:38px;width:38px;line-height:1.15;position:relative}
.grid .dh b{display:block;font-family:var(--mono);color:var(--fg);font-size:13px}
.grid .dh.we{background:var(--sunk)}
.grid .dh.ev b{color:var(--accent)}
.grid .dh .evdot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.grid td.we{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.grid tr.grp td{background:var(--sunk);font-weight:700;text-align:left;padding:0 10px;height:28px;color:var(--muted);font-size:12px;letter-spacing:.08em}
.grid tr.grp td.namecol{background:var(--sunk)}
.pname{display:flex;flex-direction:column;line-height:1.25}
.pname b{font-size:13px;font-weight:500;color:var(--fg)}
.pname span{font-size:11px;color:var(--muted)}
.tag{font-size:10px;padding:0 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:4px;font-weight:500;vertical-align:1px}
.tag.pt{border-color:var(--peak);color:var(--peak)}
.cellbtn{width:100%;height:100%;border:0;background:transparent;display:grid;place-items:center;position:relative;padding:3px}
.cellbtn:hover .chip,.cellbtn:hover .empty{outline:1px solid var(--faint)}
.chip{display:grid;place-items:center;width:28px;height:24px;border-radius:5px;font-weight:700;font-size:12px}
.sh-open{background:var(--open-bg);color:var(--open)}
.sh-mid{background:var(--mid-bg);color:var(--mid)}
.sh-close{background:var(--close-bg);color:var(--close)}
.sh-p1,.sh-p2{background:var(--peak-bg);color:var(--peak)}
.sh-off{background:transparent;color:var(--faint);font-weight:500}
.empty{width:28px;height:24px;border-radius:5px}
.avail .empty{border:1px dashed var(--peak);opacity:.55}
.reqoff .chip:not(.sh-off){box-shadow:inset 0 0 0 1.5px var(--warn)}
.reqoff .sh-off{color:var(--accent);font-weight:700}
.flag{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.flag.warn{background:var(--warn)}
.hl{animation:hl 1.6s ease-out}
@keyframes hl{0%{background:var(--warn-bg)}100%{background:transparent}}
.grid tr.sum td{height:28px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.grid tr.sum td.namecol{font-family:var(--font);font-size:12px}
.grid tr.sum.first td{border-top:2px solid var(--line)}
.gapc{color:var(--bad);font-weight:600}
.r-good{color:var(--good)} .r-warn{color:var(--warn)} .r-bad{color:var(--bad);font-weight:600}

.legend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin:10px 2px 0}
.legend .chip{width:22px;height:18px;font-size:11px;display:inline-grid;margin-right:4px;vertical-align:middle}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;justify-content:space-between}
.issues{list-style:none;margin:0;padding:6px;max-height:calc(100vh - 300px);overflow:auto}
.issues li button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;font-size:13px;line-height:1.45}
.issues li button:hover{background:var(--sunk)}
.issues .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--bad)}
.issues .warn .dot{background:var(--warn)}
.okmsg{padding:18px 14px;color:var(--good)}

/* 彈出選單 */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;width:220px}
.pop h4{margin:2px 4px 8px;font-size:13px}
.pop h4 span{color:var(--muted);font-weight:400}
.pop .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pop .opts button{border:1px solid var(--line-soft);background:var(--surface);border-radius:7px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px}
.pop .opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pop .opts button small{color:var(--muted);font-size:10px;font-family:var(--mono)}
.pop .note{font-size:12px;color:var(--muted);margin:8px 4px 2px;line-height:1.4}
.pop .note.bad{color:var(--bad)}

/* 意願總覽 */
.rq .cellv{font-size:11px;font-weight:600}
.rq .offv{color:var(--accent)}
.rq .offv.conf{color:var(--bad)}
.rq .pv{color:var(--peak)}
.statusc{font-size:11px}

/* 人效 */
.chartbox{padding:14px;overflow-x:auto}
.chartbox svg{display:block;min-width:640px;width:100%;height:auto}
table.plain{width:100%;border-collapse:collapse;font-size:13px}
table.plain th,table.plain td{padding:8px 12px;border-bottom:1px solid var(--line-soft);text-align:left}
table.plain th{font-weight:500;color:var(--muted);font-size:12px}
table.plain td.r,table.plain th.r{text-align:right}
.tbl-scroll{overflow-x:auto}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.section{margin-top:18px}
.sk{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sunk);margin:2px 3px 2px 0;white-space:nowrap}
.sk b{font-family:var(--mono)}

/* 員工端 */
.phone{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who select{flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal button.day{aspect-ratio:1/1.05;border:1px solid var(--line-soft);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px;gap:2px;min-width:0;max-width:100%}
.cal button.day .n{font-family:var(--mono);font-size:13px}
.cal button.day .s{font-size:10px;font-weight:700;line-height:1.1}
.cal button.day.we .n{color:var(--accent)}
.cal button.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cal button.day.sel .n{color:var(--accent-fg)}
.cal button.day.lock{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,transparent 4px 8px);color:var(--faint);cursor:not-allowed}
.cal button.day.pt1{background:var(--peak-bg);border-color:var(--peak);color:var(--peak)}
.cal .blank{aspect-ratio:1/1.05}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical}
.myshifts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.myshifts li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:8px}
.myshifts .dt{font-family:var(--mono);width:98px;white-space:nowrap;color:var(--muted);font-size:13px}
.myshifts .tm{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:55;background:rgba(10,20,18,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
.fld input,.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.modal-card.wide{max-width:860px}
.fgrid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:560px){.fgrid7{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrid7 input{padding:8px 6px}
.evlist{display:flex;flex-direction:column;gap:10px}
.evrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) 110px auto auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line-soft);border-radius:8px}
@media (max-width:760px){.evrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:9px;white-space:nowrap}
.skgrid{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.skrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.skrow>span{font-size:13px;min-width:3em}
.lv{display:inline-flex;gap:4px}
.lv button{width:34px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--mono);font-size:13px}
.lv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ferr{color:var(--bad);font-size:13px;margin:0}
.mact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.emptystate{max-width:520px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><b id="storeName">門市排班</b><span id="storeSub">載入中…</span></div>
    <div class="spacer"></div>
    <div class="monthnav">
      <button class="iconbtn" id="prevM" aria-label="上個月">‹</button>
      <b id="monthLbl" class="num"></b>
      <button class="iconbtn" id="nextM" aria-label="下個月">›</button>
    </div>
    <div class="seg" id="modeSeg" role="group" aria-label="身分">
      <button id="modeMgr" aria-pressed="true">店長</button>
      <button id="modeStaff" aria-pressed="false">員工</button>
    </div>
    <button class="btn" id="logoutBtn" hidden>登出</button>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs"></nav></div>
</header>
<div id="banner" hidden></div>
<main class="wrap" id="main"></main>
<div id="pop" class="pop" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ===== 排班引擎（純函式，無 DOM）===== */
const SHIFT_ORDER = ['open', 'mid', 'close', 'p1', 'p2'];
const FULL_SHIFTS = ['open', 'mid', 'close'];

function ymParts(ym) { const [y, m] = ym.split('-').map(Number); return { y, m }; }
function daysIn(ym) { const { y, m } = ymParts(ym); return new Date(y, m, 0).getDate(); }
function dow(ym, d) { const { y, m } = ymParts(ym); return new Date(y, m - 1, d).getDay(); } // 0=日
function dateKey(ym, d) { return ym + '-' + String(d).padStart(2, '0'); }
function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

function eventOf(cfg, ym, d) { return (cfg.events || {})[dateKey(ym, d)] || null; }
function dayType(cfg, ym, d) {
  const ev = eventOf(cfg, ym, d);
  if (ev && ev.type) return ev.type;
  const w = dow(ym, d);
  if (w === 0 || w === 6) return 'weekend';
  if (w === 5) return 'fri';
  return 'weekday';
}
function noLeave(cfg, ym, d) { const ev = eventOf(cfg, ym, d); return !!(ev && ev.noLeave); }
function revenueOf(cfg, ym, d) {
  const ev = eventOf(cfg, ym, d);
  if (ev && ev.revenue) return ev.revenue;
  const w = dow(ym, d);
  if (Array.isArray(cfg.revenueByDow) && cfg.revenueByDow.length === 7) return cfg.revenueByDow[w] || 0;
  const rv = cfg.revenue || {};
  if (w === 6) return rv.sat || 0;
  if (w === 0) return rv.sun || 0;
  if (w === 5) return rv.fri || 0;
  return rv.weekday || 0;
}
function revenueTable(cfg) {
  if (Array.isArray(cfg.revenueByDow) && cfg.revenueByDow.length === 7) return cfg.revenueByDow.slice();
  const r = cfg.revenue || {};
  return [r.sun || 0, r.weekday || 0, r.weekday || 0, r.weekday || 0, r.weekday || 0, r.fri || 0, r.sat || 0];
}
function demandOf(cfg, ym, g, d) { return cfg.demand[g][dayType(cfg, ym, d)]; }

/* 週一到週日為一週；回傳 [{days:[...], full:bool}] */
function weeksOf(ym) {
  const N = daysIn(ym); const weeks = []; let cur = [];
  for (let d = 1; d <= N; d++) {
    cur.push(d);
    if (dow(ym, d) === 0 || d === N) { weeks.push({ days: cur, full: cur.length === 7 }); cur = []; }
  }
  return weeks;
}

function emptyAssign(cfg, ym) {
  const N = daysIn(ym); const a = {};
  cfg.staff.forEach(s => { a[s.id] = Array(N + 1).fill(null); });
  return a;
}
function lvl(s, skill) { return (s.skills && s.skills[skill]) || 0; }
function reqOf(reqs, sid) { return reqs[sid] || null; }
function ptAvail(req, d) { return (req && req.avail && req.avail[d]) || []; }
function shiftHours(cfg, sh) { return sh && cfg.shifts[sh] ? cfg.shifts[sh].hours : 0; }
function isWork(sh) { return !!sh && sh !== 'off'; }

function restGap(cfg, prev, next) {
  if (!isWork(prev) || !isWork(next)) return 99;
  const e = toMin(cfg.shifts[prev].end), s = toMin(cfg.shifts[next].start);
  return (24 * 60 - e + s) / 60;
}

/* ---------- 自動排班 ---------- */
function generate(cfg, reqs, ym) {
  const N = daysIn(ym), R = cfg.rules;
  const A = emptyAssign(cfg, ym);
  const weeks = weeksOf(ym);
  const weekIdx = []; weeks.forEach((w, i) => w.days.forEach(d => { weekIdx[d] = i; }));
  const ft = cfg.staff.filter(s => s.type === 'FT');
  const pt = cfg.staff.filter(s => s.type === 'PT');
  const fixed = {};

  /* A. 正職休假規劃 */
  ft.forEach(s => {
    const r = reqOf(reqs, s.id);
    fixed[s.id] = new Set(((r && r.off) || []).filter(d => d >= 1 && d <= N && !noLeave(cfg, ym, d)).slice(0, R.maxRequestOff));
    fixed[s.id].forEach(d => { A[s.id][d] = 'off'; });
  });
  const isOff = (sid, d) => A[sid][d] === 'off';
  const offsOn = (g, d) => ft.filter(s => s.group === g && isOff(s.id, d)).length;
  const fullDemand = (g, d) => { const dm = demandOf(cfg, ym, g, d); return FULL_SHIFTS.reduce((t, k) => t + (dm[k] || 0), 0); };
  const critNeedCount = (g, d, skill, min) => (cfg.critical[g] || []).filter(c => c.skill === skill && c.min <= min).length;

  function maxRunIf(sid, extraOff) {
    let best = 0, run = 0;
    for (let d = 1; d <= N; d++) {
      if (isOff(sid, d) || d === extraOff) run = 0; else { run++; best = Math.max(best, run); }
    }
    return best;
  }
  function offScore(s, d) {
    if (isOff(s.id, d) || noLeave(cfg, ym, d)) return -Infinity;
    const g = s.group;
    const ftG = ft.filter(x => x.group === g).length;
    const slack = ftG - offsOn(g, d) - fullDemand(g, d); // 休了之後剩多少可用
    let score = slack * 10;
    if (slack <= 0) score -= 100;
    (cfg.critical[g] || []).forEach(c => {
      if (lvl(s, c.skill) < c.min) return;
      const qualified = ft.filter(x => x.group === g && !isOff(x.id, d) && lvl(x, c.skill) >= c.min).length;
      const need = critNeedCount(g, d, c.skill, c.min);
      const cs = qualified - 1 - need;
      score += cs < 0 ? -80 : cs * 6;
    });
    if (isOff(s.id, d - 1) || isOff(s.id, d + 1)) score += 4; // 連休比較好
    score -= maxRunIf(s.id, d) * 2;
    return score;
  }
  function placeOff(s, days) {
    let best = null, bs = -Infinity;
    days.forEach(d => { const sc = offScore(s, d); if (sc > bs) { bs = sc; best = d; } });
    if (best != null && bs > -Infinity) { A[s.id][best] = 'off'; return true; }
    return false;
  }
  const offCount = sid => { let c = 0; for (let d = 1; d <= N; d++) if (isOff(sid, d)) c++; return c; };

  // A1 每個完整週至少 weeklyOffFT 天（輪流挑，讓大家分散）
  let progress = true;
  while (progress) {
    progress = false;
    weeks.forEach(w => {
      if (!w.full) return;
      ft.forEach(s => {
        const have = w.days.filter(d => isOff(s.id, d)).length;
        if (have < R.weeklyOffFT && offCount(s.id) < R.monthlyOff) { if (placeOff(s, w.days)) progress = true; }
      });
    });
  }
  // A2 補足本月應休天數
  progress = true;
  const all = Array.from({ length: N }, (_, i) => i + 1);
  while (progress) {
    progress = false;
    ft.forEach(s => { if (offCount(s.id) < R.monthlyOff) { if (placeOff(s, all)) progress = true; } });
  }
  // A3 修正連續上班超過上限
  ft.forEach(s => {
    for (let guard = 0; guard < 10; guard++) {
      let run = 0, start = 1, found = null;
      for (let d = 1; d <= N; d++) {
        if (isOff(s.id, d)) { run = 0; start = d + 1; continue; }
        run++; if (run > R.maxConsecutive) { found = { start, end: d }; break; }
      }
      if (!found) break;
      const cand = []; for (let d = found.start + 1; d < found.end; d++) cand.push(d);
      if (!placeOff(s, cand)) break;
      // 若超過應休，移除一個不必要的休假
      if (offCount(s.id) > R.monthlyOff) {
        let removed = false;
        for (let d = N; d >= 1 && !removed; d--) {
          if (!isOff(s.id, d) || fixed[s.id].has(d)) continue;
          const w = weeks[weekIdx[d]];
          const inWeek = w.days.filter(x => isOff(s.id, x)).length;
          if (w.full && inWeek <= R.weeklyOffFT) continue;
          A[s.id][d] = null;
          if (maxRunIf(s.id, -1) > R.maxConsecutive) A[s.id][d] = 'off'; else removed = true;
        }
      }
    }
  });

  /* B. 每日排班 */
  const hours = {}, shiftCnt = {};
  cfg.staff.forEach(s => { hours[s.id] = 0; shiftCnt[s.id] = { open: 0, mid: 0, close: 0, p1: 0, p2: 0 }; });
  const weekHours = (sid, d) => weeks[weekIdx[d]].days.reduce((t, x) => t + (x < d ? shiftHours(cfg, A[sid][x]) : 0), 0);
  const workRunBefore = (sid, d) => { let r = 0; for (let x = d - 1; x >= 1 && isWork(A[sid][x]); x--) r++; return r; };

  for (let d = 1; d <= N; d++) {
    cfg.groups.forEach(G => {
      const g = G.id;
      const dm = Object.assign({ open: 0, mid: 0, close: 0, p1: 0, p2: 0 }, demandOf(cfg, ym, g, d));
      const slots = Object.assign({}, dm);
      const today = new Set();
      const ftW = ft.filter(s => s.group === g && !isOff(s.id, d));
      const ptW = pt.filter(s => s.group === g && ptAvail(reqOf(reqs, s.id), d).length);

      const canTake = (s, sh) => {
        if (today.has(s.id)) return false;
        if (s.type === 'FT' && !FULL_SHIFTS.includes(sh)) return false;
        if (s.type === 'PT') {
          if (!ptAvail(reqOf(reqs, s.id), d).includes(sh)) return false;
          if (weekHours(s.id, d) + shiftHours(cfg, sh) > (s.maxWeek || 99)) return false;
          if (workRunBefore(s.id, d) >= R.maxConsecutive) return false;
        }
        if (restGap(cfg, A[s.id][d - 1], sh) < R.minRestHours) return false;
        return true;
      };
      const score = (s, sh) => {
        let sc = 0;
        if (s.type === 'FT') sc -= hours[s.id] / 8 * 1.2;
        else sc -= hours[s.id] / 4;
        sc -= shiftCnt[s.id][sh] * 1.5;
        if (sh === 'close' && isOff(s.id, d + 1)) sc += 4;
        if (sh === 'open' && (d === 1 || isOff(s.id, d - 1) || A[s.id][d - 1] === 'open')) sc += 2;
        if (sh === 'close' && d < N && !isOff(s.id, d + 1)) {
          // 閉店後隔天不能開店；若此人是開店的關鍵人才，扣分
          (cfg.critical[g] || []).forEach(c => { if (c.shifts.includes('open') && lvl(s, c.skill) >= c.min) sc -= 1.5; });
        }
        if (s.pref && s.pref.includes(sh)) sc += 3;
        sc += Object.values(s.skills || {}).reduce((t, v) => t + v, 0) / 20;
        return sc;
      };
      const put = (s, sh) => { A[s.id][d] = sh; today.add(s.id); hours[s.id] += shiftHours(cfg, sh); shiftCnt[s.id][sh]++; slots[sh]--; };
      const pick = (pool, sh, filter) => {
        let best = null, bs = -Infinity;
        pool.forEach(s => { if (!canTake(s, sh) || (filter && !filter(s))) return; const v = score(s, sh); if (v > bs) { bs = v; best = s; } });
        return best;
      };

      // 1) 關鍵技能
      const crits = cfg.critical[g] || [];
      crits.forEach(c => {
        const ok = [...today].some(id => { const s = cfg.staff.find(x => x.id === id); return c.shifts.includes(A[id][d]) && lvl(s, c.skill) >= c.min; });
        if (ok) return;
        for (const sh of c.shifts) {
          if (slots[sh] <= 0) continue;
          const others = crits.filter(o => o !== c);
          const s = pick(ftW.concat(ptW), sh, x => lvl(x, c.skill) >= c.min);
          if (s) {
            // 保留多才多藝的人：若有替代人選且此人是其他關鍵技能的唯一人選，仍接受（簡化）
            void others; put(s, sh); break;
          }
        }
      });
      // 2) 正職填全天班
      ['open', 'close', 'mid'].forEach(sh => {
        while (slots[sh] > 0) {
          const s = pick(ftW, sh) || pick(ptW, sh);
          if (!s) break; put(s, sh);
        }
      });
      // 3) 多出來的正職排中班（機動），可抵尖峰需求
      ftW.filter(s => !today.has(s.id)).forEach(s => {
        const sh = canTake(s, 'mid') ? 'mid' : canTake(s, 'close') ? 'close' : canTake(s, 'open') ? 'open' : null;
        if (!sh) return;
        put(s, sh); slots[sh]++; // 不算在全天需求裡
        if (sh !== 'close') slots.p1--;
        if (sh !== 'open') slots.p2--;
      });
      // 4) 兼職補尖峰
      for (let guard = 0; guard < 20; guard++) {
        // 先補候選人最少的時段，避免一個人被排到另一段後這段就沒人
        let bestSh = null, fewest = Infinity;
        ['p1', 'p2'].forEach(sh => {
          if (slots[sh] <= 0) return;
          const n = ptW.filter(s => canTake(s, sh)).length;
          if (n > 0 && n < fewest) { fewest = n; bestSh = sh; }
        });
        if (!bestSh) break;
        put(pick(ptW, bestSh), bestSh);
      }
    });
  }
  // 沒排到的兼職保持空白（null）
  return A;
}

/* ---------- 檢核 ---------- */
function validate(cfg, reqs, ym, A) {
  const N = daysIn(ym), R = cfg.rules, weeks = weeksOf(ym);
  const issues = []; const cell = {};
  const add = (level, msg, sid, d, kind) => {
    issues.push({ level, msg, sid: sid || null, d: d || null, kind: kind || '' });
    if (sid && d) { const k = sid + '|' + d; (cell[k] = cell[k] || []).push({ level, msg }); }
  };
  const name = sid => (cfg.staff.find(s => s.id === sid) || {}).name || sid;

  cfg.staff.forEach(s => {
    const row = A[s.id] || []; const r = reqOf(reqs, s.id);
    // 七休一
    let run = 0;
    for (let d = 1; d <= N; d++) {
      if (isWork(row[d])) { run++; if (run === R.maxConsecutive + 1) add('error', `${name(s.id)} 連續上班 ${run} 天，超過 ${R.maxConsecutive} 天上限（七休一）`, s.id, d, 'consecutive'); }
      else run = 0;
    }
    // 輪班間隔
    for (let d = 2; d <= N; d++) {
      const gap = restGap(cfg, row[d - 1], row[d]);
      if (gap < R.minRestHours) add('error', `${name(s.id)} ${d - 1} 日${cfg.shifts[row[d - 1]].name}接 ${d} 日${cfg.shifts[row[d]].name}，只休 ${gap} 小時（需 ≥ ${R.minRestHours}）`, s.id, d, 'rest');
    }
    if (s.type === 'FT') {
      weeks.forEach((w, i) => {
        if (!w.full) return;
        const offs = w.days.filter(d => !isWork(row[d])).length;
        if (offs < R.weeklyOffFT) add('error', `${name(s.id)} ${w.days[0]}–${w.days[6]} 這週只休 ${offs} 天（一例一休需 ${R.weeklyOffFT} 天）`, s.id, w.days[6], 'weekly');
      });
      const offs = row.slice(1).filter(x => x === 'off').length;
      const blanks = []; for (let d = 1; d <= N; d++) if (!row[d]) blanks.push(d);
      if (blanks.length) add('warn', `${name(s.id)} 有 ${blanks.length} 天尚未排定`, s.id, blanks[0], 'blank');
      if (offs < R.monthlyOff && !blanks.length) add('error', `${name(s.id)} 本月休 ${offs} 天，少於應休 ${R.monthlyOff} 天`, s.id, null, 'monthly');
      if (offs > R.monthlyOff) add('warn', `${name(s.id)} 本月休 ${offs} 天，多於應休 ${R.monthlyOff} 天`, s.id, null, 'monthly');
      ((r && r.off) || []).forEach(d => {
        if (isWork(row[d])) add('warn', noLeave(cfg, ym, d) ? `${name(s.id)} 申請 ${d} 日休假，但當天是禁休日` : `${name(s.id)} 申請 ${d} 日休假，目前排了班`, s.id, d, 'request');
      });
    } else {
      weeks.forEach(w => {
        const h = w.days.reduce((t, d) => t + shiftHours(cfg, row[d]), 0);
        if (h > (s.maxWeek || 99)) add('warn', `${name(s.id)} ${w.days[0]}–${w.days[w.days.length - 1]} 排了 ${h} 小時，超過每週上限 ${s.maxWeek} 小時`, s.id, w.days[w.days.length - 1], 'ptweek');
      });
      for (let d = 1; d <= N; d++) {
        if (isWork(row[d]) && !ptAvail(r, d).includes(row[d])) add('warn', `${name(s.id)} ${d} 日沒有給${cfg.shifts[row[d]].name}，但被排入`, s.id, d, 'avail');
      }
    }
  });

  // 人力覆蓋
  const gaps = {}; // gaps[g][d] = [{shift, need, have}]
  cfg.groups.forEach(G => {
    const g = G.id; gaps[g] = {};
    const gn = cfg.groups.length > 1 ? G.name : '';
    const members = cfg.staff.filter(s => s.group === g);
    for (let d = 1; d <= N; d++) {
      const dm = Object.assign({ open: 0, mid: 0, close: 0, p1: 0, p2: 0 }, demandOf(cfg, ym, g, d));
      const have = { open: 0, mid: 0, close: 0, p1: 0, p2: 0 };
      members.forEach(s => { const sh = (A[s.id] || [])[d]; if (isWork(sh)) have[sh]++; });
      const list = [];
      ['open', 'close', 'mid'].forEach(sh => { if (have[sh] < dm[sh]) list.push({ shift: sh, need: dm[sh], have: have[sh] }); });
      const sur = k => Math.max(0, have[k] - dm[k]);
      ['p1', 'p2'].forEach(sh => {
        const cover = have[sh] + sur('mid') + (sh === 'p2' ? sur('close') : sur('open'));
        if (cover < dm[sh]) list.push({ shift: sh, need: dm[sh], have: cover });
      });
      list.forEach(x => add('error', `${d} 日${gn}${cfg.shifts[x.shift].name}缺 ${x.need - x.have} 人`, null, d, 'gap'));
      (cfg.critical[g] || []).forEach(c => {
        const ok = members.some(s => c.shifts.includes((A[s.id] || [])[d]) && lvl(s, c.skill) >= c.min);
        if (!ok) { list.push({ crit: c.label }); add('error', `${d} 日${gn}缺「${c.label}」（${c.skill} ≥ ${c.min}）`, null, d, 'crit'); }
      });
      gaps[g][d] = list;
    }
  });
  return { issues, cell, gaps };
}

/* ---------- 人效 ---------- */
function metrics(cfg, ym, A) {
  const N = daysIn(ym); const days = [];
  for (let d = 1; d <= N; d++) {
    let hrs = 0, cost = 0, heads = 0;
    cfg.staff.forEach(s => { const h = shiftHours(cfg, (A[s.id] || [])[d]); if (h) { hrs += h; cost += h * s.cost; heads++; } });
    const rev = revenueOf(cfg, ym, d);
    days.push({ d, hrs, cost, heads, rev, ratio: rev ? cost / rev * 100 : 0, perHour: hrs ? rev / hrs : 0 });
  }
  const tot = days.reduce((t, x) => ({ hrs: t.hrs + x.hrs, cost: t.cost + x.cost, rev: t.rev + x.rev }), { hrs: 0, cost: 0, rev: 0 });
  tot.ratio = tot.rev ? tot.cost / tot.rev * 100 : 0; tot.perHour = tot.hrs ? tot.rev / tot.hrs : 0;
  const person = {};
  cfg.staff.forEach(s => {
    const row = A[s.id] || []; let h = 0, off = 0, work = 0;
    for (let d = 1; d <= N; d++) { h += shiftHours(cfg, row[d]); if (row[d] === 'off') off++; if (isWork(row[d])) work++; }
    person[s.id] = { hours: h, off, work };
  });
  return { days, tot, person };
}

if (typeof module !== 'undefined') module.exports = { revenueTable, generate, validate, metrics, daysIn, dow, weeksOf, dayType, revenueOf, noLeave, eventOf, emptyAssign, restGap, isWork, SHIFT_ORDER };

/* 示範用員工意願（2026 年 11 月）。何佳穎、鄭宇軒尚未提交。 */
function demoRequests(ym) {
  const N = daysIn(ym); const r = {};
  const ft = { s01: [9, 10], s02: [5, 22], s03: [14, 18], s04: [2, 3, 26], s05: [11, 12, 13, 25], s07: [16, 17], s08: [7, 8], s10: [19, 20] };
  Object.keys(ft).forEach(id => { r[id] = { staffId: id, month: ym, off: ft[id], avail: {}, note: '' }; });
  const pt = (id, fn) => { const a = {}; for (let d = 1; d <= N; d++) { const v = fn(dow(ym, d), d); if (v && v.length) a[d] = v; } r[id] = { staffId: id, month: ym, off: [], avail: a, note: '' }; };
  pt('s11', w => w === 5 ? ['p2'] : (w === 0 || w === 6) ? ['p1', 'p2'] : []);
  pt('s12', w => (w === 1 || w === 2 || w === 4) ? ['p1', 'p2'] : w === 3 ? ['p1'] : w === 6 ? ['p2'] : []);
  pt('s13', w => (w === 3 || w === 5) ? ['p2'] : w === 0 ? ['p1', 'p2'] : []);
  pt('s14', w => (w === 1 || w === 3) ? ['p1', 'p2'] : (w >= 1 && w <= 5) ? ['p2'] : (w === 0 || w === 6) ? ['p1', 'p2'] : []);
  pt('s15', w => (w === 2 || w === 4) ? ['p1'] : (w === 0 || w === 6) ? ['p1', 'p2'] : w === 5 ? ['p1'] : []);
  pt('s16', w => (w === 1 || w === 2 || w === 4 || w === 0) ? ['p2'] : w === 6 ? ['p1'] : []);
  pt('s17', w => (w === 3 || w === 4 || w === 6 || w === 0) ? ['p2'] : []);
  r.s12.note = '週三下午有課，午峰最晚 15:00';
  return r;
}

function makeLocal() {
  let docs = {}; try { docs = JSON.parse(lsGet(LSK) || '{}'); } catch (e) { docs = {}; }
  const dsubs = {}, csubs = {};
  const persist = () => lsSet(LSK, JSON.stringify(docs));
  const colList = p => Object.keys(docs).filter(k => k.startsWith(p + '/') && k.split('/').length === p.split('/').length + 1).map(k => docs[k]);
  const notify = path => {
    (dsubs[path] || []).forEach(fn => fn(clone(docs[path]) || null));
    const col = path.split('/').slice(0, -1).join('/');
    (csubs[col] || []).forEach(fn => fn(clone(colList(col))));
  };
  return {
    docSub(path, fn) { (dsubs[path] = dsubs[path] || []).push(fn); setTimeout(() => fn(clone(docs[path]) || null)); return () => { dsubs[path] = (dsubs[path] || []).filter(f => f !== fn); }; },
    colSub(path, fn) { (csubs[path] = csubs[path] || []).push(fn); setTimeout(() => fn(clone(colList(path)))); return () => { csubs[path] = (csubs[path] || []).filter(f => f !== fn); }; },
    set(path, data) { docs[path] = clone(data); persist(); notify(path); return Promise.resolve(); },
    del(path) { delete docs[path]; persist(); notify(path); return Promise.resolve(); },
    batch(list) { list.forEach(w => { if (w.data == null) delete docs[w.path]; else docs[w.path] = clone(w.data); }); persist(); list.forEach(w => notify(w.path)); return Promise.resolve(); },
    has(path) { return !!docs[path]; },

async function call(action, extra) {

}
function makeSheets() {
  let docs = {}, last = '', inflight = 0, loaded = false;
  const dsubs = {}, csubs = {};
  const colList = p => Object.keys(docs).filter(k => k.startsWith(p + '/') && k.split('/').length === p.split('/').length + 1).map(k => docs[k]);
  const emitDoc = p => (dsubs[p] || []).forEach(fn => fn(clone(docs[p]) || null));
  const emitCol = p => (csubs[p] || []).forEach(fn => fn(clone(colList(p))));
  const emitPath = path => { emitDoc(path); emitCol(path.split('/').slice(0, -1).join('/')); };
  const emitAll = () => { Object.keys(dsubs).forEach(emitDoc); Object.keys(csubs).forEach(emitCol); };
  async function refresh() {
    if (inflight) return;
    const j = await call('load');
    S.role = j.role;
    if (inflight) return; // 讀取期間有人寫入，以本機為準，下次再同步
    const txt = JSON.stringify(j.docs || {});
    if (txt !== last || !loaded) { last = txt; docs = j.docs || {}; loaded = true; emitAll(); }
  }
  async function batch(list) {
    list.forEach(w => { if (w.data == null) delete docs[w.path]; else docs[w.path] = clone(w.data); });
    list.forEach(w => emitPath(w.path));
    inflight++;
    try { await call('batch', { writes: list.map(w => ({ path: w.path, data: w.data == null ? null : w.data })) }); }
    catch (e) { inflight--; last = ''; refresh().catch(() => {}); throw e; }
    inflight--; last = '';
  }
  return {
    refresh,
    docSub(path, fn) { (dsubs[path] = dsubs[path] || []).push(fn); if (loaded) setTimeout(() => fn(clone(docs[path]) || null)); return () => { dsubs[path] = (dsubs[path] || []).filter(f => f !== fn); }; },
    colSub(path, fn) { (csubs[path] = csubs[path] || []).push(fn); if (loaded) setTimeout(() => fn(clone(colList(path)))); return () => { csubs[path] = (csubs[path] || []).filter(f => f !== fn); }; },
    set(path, data) { return batch([{ path, data }]); },
    del(path) { return batch([{ path, data: null }]); },

}

  const missing = cfg.staff.filter(s => !reqs[s.id]).map(s => s.name);
  const rules = v.issues.filter(i => i.kind !== 'gap' && i.kind !== 'crit');
  const errs = rules.filter(i => i.level === 'error').length, warns = rules.length - errs;
  const gapsN = v.issues.filter(i => i.kind === 'gap' || i.kind === 'crit').length;
  const ratio = m ? m.tot.ratio : null;
  const rCls = r => r == null ? '' : r <= cfg.ratio.good ? 'good' : r <= cfg.ratio.warn ? 'warn' : 'bad';

  let html = `<div class="bar"><h2>${ymLabel(ym)}班表</h2><span class="pill ${st.cls}">${st.text}</span><div class="spacer"></div>
    <button class="btn ${has ? '' : 'primary'}" id="genBtn">${S.confirmGen ? '再按一次，覆蓋目前班表' : (has ? '重新 AI 排班' : 'AI 自動排班')}</button>
    <button class="btn ${has ? 'primary' : ''}" id="pubBtn" ${has ? '' : 'disabled'}>發布班表</button></div>
  <div class="kpis">
    <div class="kpi ${submitted < cfg.staff.length ? 'warn' : 'good'}"><div class="k">意願提交</div><div class="v num">${submitted}/${cfg.staff.length}<small>${missing.length ? '未交：' + esc(missing.join('、')) : '全部到齊'}</small></div></div>
    <div class="kpi ${!has ? '' : errs ? 'bad' : warns ? 'warn' : 'good'}"><div class="k">勞基法與規則</div><div class="v num">${has ? errs : '–'}<small>${has ? `違規 · 提醒 ${warns}` : '排班後檢核'}</small></div></div>
    <div class="kpi ${!has ? '' : gapsN ? 'bad' : 'good'}"><div class="k">人力缺口</div><div class="v num">${has ? gapsN : '–'}<small>${has ? (gapsN ? '處需補人' : '每個時段都排滿') : ''}</small></div></div>
    <div class="kpi ${rCls(ratio)}"><div class="k">人事成本比（目標 ≤ ${cfg.ratio.good}%）</div><div class="v num">${ratio == null ? '–' : ratio.toFixed(1) + '%'}<small>${m ? 'NT$' + money(m.tot.cost) : ''}</small></div></div>
  </div>`;
  if (!has) html += `<p class="muted small" style="margin:-4px 2px 12px">還沒有班表。下方已帶入員工劃休（橘框「休」）與兼職可上班日（紫色虛線），按「AI 自動排班」會依技能、需求人數、勞基法和員工意願排出整月。</p>`;

  html += `<div class="two"><div style="min-width:0"><div class="gridbox" id="gridbox"><table class="grid"><thead><tr><th class="namecol">員工</th>`;
  for (let d = 1; d <= N; d++) {
    const w = dow(ym, d), ev = eventOf(cfg, ym, d), we = w === 0 || w === 6;
    html += `<th class="dh ${we ? 'we' : ''} ${ev ? 'ev' : ''}" id="dh${d}" ${ev ? `title="${esc(ev.label)}${ev.noLeave ? '（禁休）' : ''}"` : ''}><b>${d}</b>${WD[w]}${ev ? '<span class="evdot"></span>' : ''}</th>`;
  }
  html += `</tr></thead><tbody>`;
  cfg.groups.forEach(G => {
    if (cfg.groups.length > 1) html += `<tr class="grp"><td class="namecol">${esc(G.name)}</td><td colspan="${N}"></td></tr>`;
    cfg.staff.filter(s => s.group === G.id).forEach(s => {
      const r = reqs[s.id]; const ps = m ? m.person[s.id] : null;
      const sub = ps ? `${s.title} · ${ps.hours}h${s.type === 'FT' ? ' · 休' + ps.off : ''}` : s.title;
      html += `<tr><td class="namecol"><div class="pname"><b>${esc(s.name)}<span class="tag ${s.type === 'PT' ? 'pt' : ''}">${s.type === 'PT' ? '兼' : '正'}</span></b><span>${esc(sub)}</span></div></td>`;
      for (let d = 1; d <= N; d++) {
        const sh = A[s.id] ? A[s.id][d] : null;
        const w = dow(ym, d), we = w === 0 || w === 6;
        const reqOff = s.type === 'FT' && r && (r.off || []).includes(d);
        const av = s.type === 'PT' && r && r.avail && r.avail[d] && r.avail[d].length;
        const ci = v.cell[s.id + '|' + d];
        const flag = ci ? `<span class="flag ${ci.some(x => x.level === 'error') ? '' : 'warn'}"></span>` : '';
        const inner = sh ? `<span class="chip sh-${sh}">${sh === 'off' ? '休' : esc(cfg.shifts[sh].short)}</span>`
          : (!has && reqOff ? `<span class="chip sh-off">休</span>` : '<span class="empty"></span>');
        html += `<td class="${we ? 'we' : ''} ${reqOff ? 'reqoff' : ''} ${av && !sh ? 'avail' : ''}"><button class="cellbtn" data-sid="${s.id}" data-d="${d}" aria-label="${esc(s.name)} ${mNum(ym)}/${d}">${inner}${flag}</button></td>`;
      }
      html += `</tr>`;
    });
    if (has) {
      html += `<tr class="sum"><td class="namecol muted">${cfg.groups.length > 1 ? esc(G.name) : ''}缺口</td>`;
      for (let d = 1; d <= N; d++) { const g = (v.gaps[G.id] || {})[d] || []; html += `<td class="${g.length ? 'gapc' : ''}" title="${esc(g.map(x => x.crit ? '缺' + x.crit : cfg.shifts[x.shift].name + '缺' + (x.need - x.have)).join('、'))}">${g.length ? '!' + g.length : ''}</td>`; }
      html += `</tr>`;
    }
  });
  if (m) {
    const rowOf = (label, fn, first) => { let h = `<tr class="sum ${first ? 'first' : ''}"><td class="namecol">${label}</td>`; m.days.forEach(x => { h += fn(x); }); return h + '</tr>'; };
    html += rowOf('上班人數', x => `<td>${x.heads}</td>`, true);
    html += rowOf('排班工時', x => `<td>${x.hrs}</td>`);
    html += rowOf('人事成本比', x => `<td class="r-${rCls(x.ratio)}">${x.ratio.toFixed(0)}%</td>`);
  }
  html += `</tbody></table></div>
    <div class="legend"><span><span class="chip sh-open">開</span>開店 09:30–18:30</span><span><span class="chip sh-mid">中</span>中班 11:00–20:00</span><span><span class="chip sh-close">閉</span>閉店 14:00–23:00</span><span><span class="chip sh-p1">午</span>午峰 11:00–15:00</span><span><span class="chip sh-p2">晚</span>晚峰 17:00–21:30</span><span><i style="background:var(--bad)"></i>違規</span><span><i style="background:var(--warn)"></i>提醒</span><span><i style="background:var(--accent)"></i>活動日</span></div>
  </div>`;

  html += `<aside class="panel"><div class="panel-h"><h3>檢核結果</h3><span class="small muted">${has ? v.issues.length + ' 項' : ''}</span></div>`;
  if (!has) html += `<p class="okmsg muted" style="color:var(--muted)">排班後會在這裡列出違規、缺口和未滿足的意願，點一下就跳到那一格。</p>`;
  else if (!v.issues.length) html += `<p class="okmsg">全部符合規則，每個時段都排滿。</p>`;
  else {
    const order = { crit: 0, gap: 1 };
    const list = v.issues.slice().sort((a, b) => (a.level === b.level ? 0 : a.level === 'error' ? -1 : 1) || ((order[a.kind] ?? 2) - (order[b.kind] ?? 2)) || ((a.d || 0) - (b.d || 0)));
    html += `<ul class="issues">${list.map(i => `<li class="${i.level}"><button data-isid="${i.sid || ''}" data-isd="${i.d || ''}"><span class="dot"></span><span>${esc(i.msg)}</span></button></li>`).join('')}</ul>`;
  }
  html += `</aside></div>`;
  main.innerHTML = html;

  $('genBtn').onclick = () => {
    if (has && !S.confirmGen) { S.confirmGen = true; render(); setTimeout(() => { if (S.confirmGen) { S.confirmGen = false; render(); } }, 4000); return; }
    S.confirmGen = false;
    const t0 = performance.now();
    S.edit = generate(cfg, reqs, ym);
    const vv = validate(cfg, reqs, ym, S.edit);
    queueSave({ generatedAt: new Date().toISOString() });
    render();
    const e = vv.issues.filter(i => i.level === 'error').length;
    toast(`已排好 ${N} 天班表（${Math.max(1, Math.round(performance.now() - t0))} ms）${e ? `，還有 ${e} 項需要處理` : '，全部符合規則'}`);
  };
  $('pubBtn').onclick = () => {
    if (!S.edit) return;
    queueSave({ published: clone(S.edit), publishedAt: new Date().toISOString() });
    toast('已發布，員工在「員工」頁可以看到自己的班');
  };
  main.querySelectorAll('.cellbtn').forEach(b => { b.onclick = ev => { ev.stopPropagation(); openPop(b); }; });
  main.querySelectorAll('[data-isd]').forEach(b => { b.onclick = () => jumpTo(b.dataset.isid, b.dataset.isd); });
}

function jumpTo(sid, d) {
  let el = null;
  if (sid && d) el = document.querySelector(`.cellbtn[data-sid="${sid}"][data-d="${d}"]`);
  else if (d) el = $('dh' + d);
  else if (sid) el = document.querySelector(`.cellbtn[data-sid="${sid}"][data-d="1"]`);
  if (!el) return;
  el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  const td = el.closest('td,th'); td.classList.remove('hl'); void td.offsetWidth; td.classList.add('hl');
}

/* ---------- 單格編輯 ---------- */
function openPop(btn) {
  const cfg = S.cfg, ym = S.ym, sid = btn.dataset.sid, d = Number(btn.dataset.d);
  const s = cfg.staff.find(x => x.id === sid); const r = reqsFor(ym)[sid];
  const cur = S.edit && S.edit[sid] ? S.edit[sid][d] : null;
  const opts = s.type === 'FT' ? ['open', 'mid', 'close', 'off', null] : ['p1', 'p2', 'open', 'mid', 'close', null];
  const label = k => k === 'off' ? ['休', '休假'] : k == null ? ['–', s.type === 'FT' ? '清除' : '不排'] : [cfg.shifts[k].short, cfg.shifts[k].start];
  let note = '';
  if (s.type === 'FT') note = r ? ((r.off || []).includes(d) ? '員工申請這天休假' + (noLeave(cfg, ym, d) ? '，但當天禁休' : '') : '') : '此員工尚未提交意願';
  else { const a = r && r.avail && r.avail[d]; note = !r ? '此員工尚未提交意願' : a && a.length ? '可上班：' + a.map(k => cfg.shifts[k].name).join('、') : '這天沒有給班'; }
  const ci = (S.edit && validate(cfg, reqsFor(ym), ym, S.edit).cell[sid + '|' + d]) || [];
  const pop = $('pop');
  pop.innerHTML = `<h4>${esc(s.name)} <span>${mNum(ym)}/${d}（${WD[dow(ym, d)]}）</span></h4>
    <div class="opts">${opts.map(k => { const [a, b] = label(k); return `<button data-v="${k == null ? '' : k}" aria-pressed="${cur === k || (!cur && k == null)}"><b>${a}</b><small>${b}</small></button>`; }).join('')}</div>
    ${note ? `<p class="note">${esc(note)}</p>` : ''}${ci.map(x => `<p class="note ${x.level === 'error' ? 'bad' : ''}">${esc(x.msg)}</p>`).join('')}`;
  pop.hidden = false;
  const rc = btn.getBoundingClientRect(), pw = 220, ph = pop.offsetHeight;
  let left = Math.min(rc.left, window.innerWidth - pw - 12); left = Math.max(12, left);
  let top = rc.bottom + 6; if (top + ph > window.innerHeight - 12) top = Math.max(12, rc.top - ph - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  pop.querySelectorAll('button[data-v]').forEach(b => {
    b.onclick = () => {
      if (!S.edit) S.edit = emptyAssign(cfg, ym);
      if (!S.edit[sid]) S.edit[sid] = Array(daysIn(ym) + 1).fill(null);
      S.edit[sid][d] = b.dataset.v || null;
      closePop(); queueSave(); render();
      requestAnimationFrame(() => { const el = document.querySelector(`.cellbtn[data-sid="${sid}"][data-d="${d}"]`); if (el) el.focus({ preventScroll: true }); });
    };
  });
  pop.querySelector('button[aria-pressed="true"]')?.focus({ preventScroll: true });
}
function closePop() { $('pop').hidden = true; }
document.addEventListener('click', e => { if (!$('pop').hidden && !$('pop').contains(e.target)) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('resize', closePop);

/* ---------- 店長：員工意願 ---------- */
function renderRequests(main) {
  const cfg = S.cfg, ym = S.ym, N = daysIn(ym), reqs = reqsFor(ym);
  const submitted = cfg.staff.filter(s => reqs[s.id]).length;
  let html = `<div class="bar"><h2>${ymLabel(ym)}員工意願</h2><span class="pill ${submitted === cfg.staff.length ? 'good' : 'warn'}">已提交 ${submitted}/${cfg.staff.length}</span></div>
  <p class="muted small" style="margin:-6px 2px 12px">員工打開網址、輸入員工密碼後，就會直接進入填寫畫面。正職每月最多指定 ${cfg.rules.maxRequestOff} 天休假，禁休日不開放。</p>
  <div class="gridbox rq"><table class="grid"><thead><tr><th class="namecol">員工</th><th style="min-width:96px">狀態</th>`;
  for (let d = 1; d <= N; d++) { const w = dow(ym, d), ev = eventOf(cfg, ym, d); html += `<th class="dh ${w === 0 || w === 6 ? 'we' : ''} ${ev ? 'ev' : ''}" ${ev ? `title="${esc(ev.label)}"` : ''}><b>${d}</b>${WD[w]}${ev ? '<span class="evdot"></span>' : ''}</th>`; }
  html += `</tr></thead><tbody>`;
  cfg.groups.forEach(G => {
    if (cfg.groups.length > 1) html += `<tr class="grp"><td class="namecol">${esc(G.name)}</td><td colspan="${N + 1}"></td></tr>`;
    cfg.staff.filter(s => s.group === G.id).forEach(s => {
      const r = reqs[s.id];
      html += `<tr><td class="namecol"><div class="pname"><b>${esc(s.name)}<span class="tag ${s.type === 'PT' ? 'pt' : ''}">${s.type === 'PT' ? '兼' : '正'}</span></b><span>${s.type === 'PT' ? '給班' : '劃休'}${r ? (s.type === 'FT' ? ` ${(r.off || []).length} 天` : ` ${Object.keys(r.avail || {}).length} 天`) : ''}</span></div></td>
        <td class="statusc">${r ? `<span class="pill good">${fmtTime(r.submittedAt)}</span>` : '<span class="pill bad">未提交</span>'}</td>`;
      for (let d = 1; d <= N; d++) {
        const w = dow(ym, d); let c = '';
        if (r && s.type === 'FT' && (r.off || []).includes(d)) c = `<span class="cellv offv ${noLeave(cfg, ym, d) ? 'conf' : ''}" title="${noLeave(cfg, ym, d) ? '禁休日' : '指定休'}">休</span>`;
        if (r && s.type === 'PT') { const a = (r.avail || {})[d] || []; if (a.length) c = `<span class="cellv pv">${a.map(k => cfg.shifts[k].short).join('')}</span>`; }
        html += `<td class="${w === 0 || w === 6 ? 'we' : ''}">${c}</td>`;

      html += `</tr>`;

/* ---------- 店長：人效 ---------- */
function renderMetrics(main) {
  const cfg = S.cfg, ym = S.ym;
  if (!S.edit) { main.innerHTML = `<div class="emptystate"><h2>還沒有班表</h2><p class="muted">先到「排班表」按 AI 自動排班，這裡會算出每天的人事成本比和工時。</p><a class="btn primary" href="#schedule">前往排班表</a></div>`; return; }
  const m = metrics(cfg, ym, S.edit);
  const rc = r => r <= cfg.ratio.good ? 'good' : r <= cfg.ratio.warn ? 'warn' : 'bad';
  let html = `<div class="bar"><h2>${ymLabel(ym)}人效</h2><span class="muted small">依排定工時 × 每人時薪成本（含勞健保）估算，營收為目標值</span></div>
  <div class="kpis">
    <div class="kpi ${rc(m.tot.ratio)}"><div class="k">人事成本比</div><div class="v num">${m.tot.ratio.toFixed(1)}%<small>目標 ≤ ${cfg.ratio.good}%</small></div></div>
    <div class="kpi"><div class="k">預估人事成本</div><div class="v num">${money(m.tot.cost)}<small>NT$</small></div></div>
    <div class="kpi"><div class="k">目標營收</div><div class="v num">${money(m.tot.rev)}<small>NT$</small></div></div>
    <div class="kpi"><div class="k">每工時營收</div><div class="v num">${money(m.tot.perHour)}<small>NT$ · ${m.tot.hrs} 工時</small></div></div>
  </div>`;
  // 圖表
  const W = 900, H = 260, L = 40, Rr = 12, T = 14, B = 34, N = m.days.length;
  const maxR = Math.max(30, Math.ceil(Math.max(...m.days.map(x => x.ratio)) / 5) * 5);
  const y = r => T + (H - T - B) * (1 - r / maxR), bw = (W - L - Rr) / N;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每日人事成本比">`;
  for (let r = 0; r <= maxR; r += 5) svg += `<line x1="${L}" x2="${W - Rr}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L - 6}" y="${y(r) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${r}%</text>`;
  m.days.forEach((x, i) => {
    const cx = L + i * bw, h = y(0) - y(x.ratio), w = dow(ym, x.d);
    svg += `<rect x="${cx + bw * 0.18}" y="${y(x.ratio)}" width="${bw * 0.64}" height="${Math.max(0, h)}" rx="2" fill="var(--${rc(x.ratio)})" opacity=".85"><title>${mNum(ym)}/${x.d}（${WD[w]}）${x.ratio.toFixed(1)}%｜成本 ${money(x.cost)}／營收 ${money(x.rev)}</title></rect>`;
    svg += `<text x="${cx + bw / 2}" y="${H - B + 16}" text-anchor="middle" font-size="11" font-family="var(--mono)" fill="${w === 0 || w === 6 ? 'var(--accent)' : 'var(--muted)'}">${x.d}</text>`;
  });
  [[cfg.ratio.good, 'var(--good)', '目標'], [cfg.ratio.warn, 'var(--bad)', '警戒']].forEach(([r, c, t]) => {
    svg += `<line x1="${L}" x2="${W - Rr}" y1="${y(r)}" y2="${y(r)}" stroke="${c}" stroke-dasharray="4 4" stroke-width="1.2"/><rect x="${L + 4}" y="${y(r) - 15}" width="58" height="13" rx="2" fill="var(--surface)" opacity=".85"/><text x="${L + 8}" y="${y(r) - 5}" font-size="11" fill="${c}">${t} ${r}%</text>`;
  });
  svg += `<text x="${L}" y="${H - 4}" font-size="11" fill="var(--muted)">日期（綠色為週末）</text></svg>`;
  html += `<div class="panel"><div class="panel-h"><h3>每日人事成本比</h3><span class="small muted">滑過長條看金額</span></div><div class="chartbox">${svg}</div></div>`;
  // 建議
  const worst = m.days.slice().sort((a, b) => b.ratio - a.ratio).filter(x => x.ratio > cfg.ratio.warn).slice(0, 4);
  html += `<div class="cards3 section"><div class="panel"><div class="panel-h"><h3>成本偏高的日子</h3></div>`;
  html += worst.length ? `<table class="plain"><tbody>${worst.map(x => `<tr><td class="num">${mNum(ym)}/${x.d}（${WD[dow(ym, x.d)]}）</td><td class="r num r-bad">${x.ratio.toFixed(1)}%</td><td class="r small muted">${x.heads} 人 · ${x.hrs}h · 營收 ${money(x.rev / 1000)}k</td></tr>`).join('')}</tbody></table><p class="small muted" style="padding:0 12px 12px;margin:0">這幾天多半是正職人力有餘、被排成機動中班。可以把其中一位調去支援其他店，或把休假移到這幾天。</p>`
    : `<p class="okmsg">沒有超過警戒線的日子。</p>`;
  html += `</div><div class="panel"><div class="panel-h"><h3>依日別平均</h3></div><table class="plain"><thead><tr><th>日別</th><th class="r">天數</th><th class="r">平均人數</th><th class="r">成本比</th></tr></thead><tbody>`;
  [['weekday', '平日（一～四）'], ['fri', '週五'], ['weekend', '週末與活動']].forEach(([k, n]) => {
    const ds = m.days.filter(x => dayType(cfg, ym, x.d) === k); if (!ds.length) return;
    const c = ds.reduce((t, x) => t + x.cost, 0), r = ds.reduce((t, x) => t + x.rev, 0), hd = ds.reduce((t, x) => t + x.heads, 0) / ds.length;
    html += `<tr><td>${n}</td><td class="r num">${ds.length}</td><td class="r num">${hd.toFixed(1)}</td><td class="r num r-${rc(c / r * 100)}">${(c / r * 100).toFixed(1)}%</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

    s.maxWeek = Number(m.querySelector('#fMax').value);

  const bind = m => {

    m.querySelector('#fType').onchange = e => { readFields(m); s.type = e.target.value; if (s.type === 'PT' && !s.maxWeek) s.maxWeek = 20; bind(m); };

      if (!confirmDel) { readFields(m); confirmDel = true; bind(m); return; }
      const next = clone(cfg); next.staff = next.staff.filter(x => x.id !== sid);
      if (S.me === sid) { S.me = null; lsSet('roster-me', ''); }
      saveCfg(next, `已移除 ${s.name}，重新 AI 排班時就不會排到他`);

/* ---------- 營收目標與活動日編輯 ---------- */
function openRevenueEditor() {
  const cfg = S.cfg;
  const st = {
    rev: revenueTable(cfg),
    good: cfg.ratio.good, warn: cfg.ratio.warn,
    events: Object.keys(cfg.events || {}).sort().map(k => Object.assign({ date: k }, clone(cfg.events[k])))
  };
  const typeOpts = [['', '依星期'], ['weekday', '平日'], ['fri', '週五'], ['weekend', '週末']];
  const draw = () => `<h3>營收目標與活動日</h3>
    <div class="fld"><span>每日營收目標（NT$）</span><div class="fgrid7">${[1, 2, 3, 4, 5, 6, 0].map(w => `<label class="fld"><span>週${WD[w]}</span><input type="number" inputmode="numeric" min="0" step="1000" data-rev="${w}" value="${st.rev[w]}"></label>`).join('')}</div></div>
    <div class="fgrid">
      <label class="fld"><span>人事成本比目標（%）</span><input id="fGood" type="number" inputmode="decimal" min="1" max="60" step="0.5" value="${st.good}"></label>
      <label class="fld"><span>人事成本比警戒（%）</span><input id="fWarn" type="number" inputmode="decimal" min="1" max="80" step="0.5" value="${st.warn}"></label>
    </div>
    <p class="small muted" style="margin:-6px 0 0">低於目標顯示綠色，介於目標和警戒之間顯示橘色，超過警戒顯示紅色。</p>
    <div class="fld"><span>活動日　<small class="muted">特別的日子可以另設營收、比照的人力需求，或設為禁休</small></span>
      <div class="evlist">${st.events.map((e, i) => `<div class="evrow">
        <label class="fld"><span>日期</span><input type="date" data-ev="${i}" data-k="date" value="${esc(e.date)}"></label>
        <label class="fld"><span>名稱</span><input maxlength="12" data-ev="${i}" data-k="label" value="${esc(e.label)}" placeholder="例如：母親節"></label>
        <label class="fld"><span>營收目標（空白＝依星期）</span><input type="number" inputmode="numeric" min="0" step="1000" data-ev="${i}" data-k="revenue" value="${e.revenue || ''}"></label>
        <label class="fld"><span>人力需求比照</span><select data-ev="${i}" data-k="type">${typeOpts.map(([v, n]) => `<option value="${v}" ${(e.type || '') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        <label class="chk"><input type="checkbox" data-ev="${i}" data-k="noLeave" ${e.noLeave ? 'checked' : ''}>禁休</label>
        <button type="button" class="btn" data-evdel="${i}" aria-label="刪除這個活動日">刪除</button>
      </div>`).join('') || '<p class="small muted" style="margin:0">目前沒有活動日。</p>'}</div>
      <div><button type="button" class="btn" id="evAdd">＋ 新增活動日</button></div></div>
    <p class="ferr" id="fErr" hidden></p>
    <div class="mact"><div class="spacer"></div><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave">儲存</button></div>`;
  const read = m => {
    m.querySelectorAll('[data-rev]').forEach(i => { st.rev[Number(i.dataset.rev)] = i.value === '' ? NaN : Number(i.value); });
    st.good = Number(m.querySelector('#fGood').value); st.warn = Number(m.querySelector('#fWarn').value);
    m.querySelectorAll('[data-ev]').forEach(i => {
      const e = st.events[Number(i.dataset.ev)], k = i.dataset.k;
      if (k === 'noLeave') e.noLeave = i.checked;
      else if (k === 'revenue') e.revenue = i.value === '' ? null : Number(i.value);
      else e[k] = i.value.trim();
    });
  };
  const bind = m => {
    m.querySelector('.modal-card').innerHTML = draw();
    m.querySelector('.modal-card').classList.add('wide');
    m.querySelector('#mCancel').onclick = closeModal;
    m.querySelector('#evAdd').onclick = () => { read(m); st.events.push({ date: '', label: '', revenue: null, type: '', noLeave: false }); bind(m); const ins = m.querySelectorAll('[data-k="date"]'); ins[ins.length - 1].focus(); };
    m.querySelectorAll('[data-evdel]').forEach(b => { b.onclick = () => { read(m); st.events.splice(Number(b.dataset.evdel), 1); bind(m); }; });
    m.querySelector('#mSave').onclick = () => {
      read(m);
      const err = m.querySelector('#fErr'); const fail = t => { err.textContent = t; err.hidden = false; };
      for (const w of [1, 2, 3, 4, 5, 6, 0]) { const v = st.rev[w]; if (!(v >= 0 && v <= 100000000)) return fail(`週${WD[w]}營收請填 0 以上的數字`); }
      if (!(st.good > 0 && st.good <= 60)) return fail('目標比請填 0 到 60 之間的數字');
      if (!(st.warn > st.good && st.warn <= 80)) return fail('警戒比要大於目標比，且不超過 80');
      const seen = new Set(); const events = {};
      for (const e of st.events) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return fail('每個活動日都要選日期');
        if (!e.label) return fail(`${e.date} 的活動日需要名稱`);
        if (seen.has(e.date)) return fail(`${e.date} 重複了，同一天只能有一個活動日`);
        if (e.revenue != null && !(e.revenue >= 0)) return fail(`${e.label} 的營收目標請填數字或留空`);
        seen.add(e.date);
        const o = { label: e.label };
        if (e.revenue) o.revenue = Math.round(e.revenue);
        if (e.type) o.type = e.type;
        if (e.noLeave) o.noLeave = true;
        events[e.date] = o;
      }
      const next = clone(cfg);
      next.revenueByDow = st.rev.map(v => Math.round(v));
      next.ratio = { good: st.good, warn: st.warn };
      next.events = events;
      saveCfg(next, '已更新營收目標與活動日，人效數字已重新計算');
    };
  };
  openModal('', bind);
}

  const r = me ? reqsFor(ym)[me.id] : null;
  let html = `<div class="phone"><div class="card"><div class="who"><label for="meSel" class="muted">我是</label>
    <select id="meSel"><option value="">選擇你的名字</option>${cfg.groups.map(G => `<optgroup label="${cfg.groups.length > 1 ? esc(G.name) : '員工'}">${cfg.staff.filter(s => s.group === G.id).map(s => `<option value="${s.id}" ${s.id === S.me ? 'selected' : ''}>${esc(s.name)}（${s.type === 'FT' ? '正職' : '兼職'}）</option>`).join('')}</optgroup>`).join('')}</select></div>
    <p class="hint">第一次使用請選自己的名字，這台裝置之後會記住。</p></div>`;
  if (!me) { main.innerHTML = html + '</div>'; bindStaff(); return; }
  const isFT = me.type === 'FT';
  const f = S.form;
  html += `<div class="card"><div class="bar" style="margin:0 0 4px"><h2>${mNum(ym)} 月${isFT ? '休假' : '可上班時段'}</h2><div class="spacer"></div>${r ? `<span class="pill good">已送出 ${fmtTime(r.submittedAt)}</span>` : '<span class="pill warn">尚未送出</span>'}</div>
    <p class="hint">${isFT ? `點日期指定想休的日子，最多 ${cfg.rules.maxRequestOff} 天。其餘休假 AI 會依規則幫你排滿 ${cfg.rules.monthlyOff} 天。斜線的日子是禁休日。` : '點日期設定可以上的時段：點一下午峰、兩下晚峰、三下兩段都可以，再點一下取消。'}</p>
    <div class="cal">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="wd">${w}</div>`).join('')}`;
  const offset = (dow(ym, 1) + 6) % 7;
  for (let i = 0; i < offset; i++) html += '<div class="blank"></div>';
  for (let d = 1; d <= N; d++) {
    const w = dow(ym, d), ev = eventOf(cfg, ym, d), lock = isFT && noLeave(cfg, ym, d);
    let cls = 'day', s = ev ? esc(ev.label.slice(0, 2)) : '';
    if (w === 0 || w === 6) cls += ' we';
    if (isFT) { if (lock) cls += ' lock'; else if (f.off.has(d)) { cls += ' sel'; s = '休'; } }
    else { const a = f.avail[d] || []; if (a.length) { cls += ' pt1'; s = a.map(k => cfg.shifts[k].short).join(''); } }
    html += `<button class="${cls}" data-day="${d}" ${lock ? 'aria-disabled="true"' : ''} aria-label="${mNum(ym)}月${d}日"><span class="n">${d}</span><span class="s">${s}</span></button>`;
  }
  html += `</div><p class="hint">${isFT ? `已選 <b class="num">${f.off.size}</b> / ${cfg.rules.maxRequestOff} 天` : `可上班 <b class="num">${Object.keys(f.avail).filter(k => (f.avail[k] || []).length).length}</b> 天 · 每週最多排 ${me.maxWeek} 小時`}</p>
    <label for="noteIn" class="hint" style="display:block;margin-top:12px">給店長的備註（選填）</label>
    <textarea id="noteIn" placeholder="例如：週三下午有課">${esc(f.note)}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center"><button class="btn primary" id="submitBtn" ${S.readOnly ? 'disabled' : ''}>${r ? '更新意願' : '送出意願'}</button>${S.formDirty ? '<span class="small muted">有修改尚未送出</span>' : ''}</div></div>`;
  // 我的班表
  const pub = S.sched && S.sched.published;
  html += `<div class="card"><h2>我的 ${mNum(ym)} 月班表</h2>`;
  if (!pub || !pub[me.id]) html += `<p class="hint">店長還沒發布這個月的班表，發布後會顯示在這裡。</p>`;
  else {
    const row = pub[me.id]; let hrs = 0, items = '';
    for (let d = 1; d <= N; d++) {
      const sh = row[d]; if (!isWork(sh)) continue; hrs += cfg.shifts[sh].hours;
      items += `<li><span class="dt">${mNum(ym)}/${d}（${WD[dow(ym, d)]}）</span><span class="chip sh-${sh}">${cfg.shifts[sh].short}</span>${cfg.shifts[sh].name}<span class="tm">${cfg.shifts[sh].start}–${cfg.shifts[sh].end}</span></li>`;
    }
    html += `<p class="hint">發布於 ${fmtTime(S.sched.publishedAt)} · 共 ${items ? items.split('<li>').length - 1 : 0} 班、${hrs} 小時</p><ul class="myshifts">${items || '<li>這個月沒有排班</li>'}</ul>`;
  }
  html += `</div></div>`;
  main.innerHTML = html;
  bindStaff();
}
function bindStaff() {
  const cfg = S.cfg, ym = S.ym;
  $('meSel').onchange = e => { S.me = e.target.value || null; lsSet('roster-me', S.me || ''); S.formKey = ''; S.formDirty = false; render(); };
  const me = cfg.staff.find(s => s.id === S.me); if (!me) return;
  document.querySelectorAll('.cal button.day').forEach(b => {
    b.onclick = () => {
      const d = Number(b.dataset.day), f = S.form;
      if (me.type === 'FT') {
        if (noLeave(cfg, ym, d)) { toast(`${mNum(ym)}/${d} ${eventOf(cfg, ym, d).label}，當天不開放劃休`); return; }
        if (f.off.has(d)) f.off.delete(d);
        else { if (f.off.size >= cfg.rules.maxRequestOff) { toast(`每月最多指定 ${cfg.rules.maxRequestOff} 天`); return; } f.off.add(d); }
      } else {
        const cyc = [[], ['p1'], ['p2'], ['p1', 'p2']];
        const cur = JSON.stringify(f.avail[d] || []); const i = cyc.findIndex(c => JSON.stringify(c) === cur);
        const nx = cyc[(i + 1) % cyc.length]; if (nx.length) f.avail[d] = nx; else delete f.avail[d];
      }
      S.formDirty = true; render();
    };
  });
  $('noteIn').oninput = e => { S.form.note = e.target.value; if (!S.formDirty) { S.formDirty = true; } };
  $('submitBtn').onclick = () => {
    const f = S.form;
    const doc = { staffId: me.id, month: ym, off: [...f.off].sort((a, b) => a - b), avail: f.avail, note: f.note.slice(0, 300), submittedAt: new Date().toISOString() };
    API.set(P.req(ym, me.id), doc).then(() => { S.formDirty = false; toast('已送出，店長排班時會看到'); render(); }).catch(writeErr);
  };
}

/* ---------- 啟動 ---------- */
$('prevM').onclick = () => { const i = MONTHS.indexOf(S.ym); if (i > 0) { S.ym = MONTHS[i - 1]; S.formKey = ''; subSched(); render(); } };
$('nextM').onclick = () => { const i = MONTHS.indexOf(S.ym); if (i < MONTHS.length - 1) { S.ym = MONTHS[i + 1]; S.formKey = ''; subSched(); render(); } };
$('modeMgr').onclick = () => go(S.tab);
$('logoutBtn').onclick = () => logout('');
$('modeStaff').onclick = () => go('staff');
boot();

</script>
</body>
</html>
